# Gateway resource for the AKS baseline workload namespace. The approuting-istio
# GatewayClass is provisioned automatically by the application routing add-on
# with Gateway API (Istio gateway controller + Envoy gateway proxy).
#
# The infrastructure.annotations configure the Envoy proxy Service as an
# internal load balancer bound to the ingress services subnet.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bu0001a0008-gateway
  namespace: a0008
  labels:
    app.kubernetes.io/name: bu0001a0008-gateway
spec:
  gatewayClassName: approuting-istio
  infrastructure:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "snet-clusteringressservices"
  listeners:
  - name: https
    hostname: "bu0001a0008-00.aks-ingress.contoso.com"
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: bu0001a0008-ingress-tls
    allowedRoutes:
      namespaces:
        from: Same
  - name: http
    hostname: "bu0001a0008-00.aks-ingress.contoso.com"
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
