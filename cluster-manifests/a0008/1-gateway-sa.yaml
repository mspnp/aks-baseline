# ServiceAccount bound to a user-assigned managed identity via Microsoft Entra
# Workload Identity. The Application Routing operator uses this identity chain
# for automatic TLS certificate synchronization from Azure Key Vault and DNS
# record reconciliation via ExternalDNS.
#
# The azure.workload.identity/client-id annotation associates this SA with the
# UAMI (mi-app-routing-workload) created in cluster-stamp.bicep. The
# azure.workload.identity/use: "true" label instructs the AKS workload identity
# mutating webhook to project a federated token into pods that consume this
# ServiceAccount, enabling OIDC token exchange against the cluster's issuer URL.
# Both the annotation and the label are required for the Application Routing
# operator's TLS and DNS integrations to authenticate to Azure successfully.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: approuting-gateway-sa
  namespace: a0008
  annotations:
    azure.workload.identity/client-id: "${MI_APP_ROUTING_CLIENT_ID}"
  labels:
    azure.workload.identity/use: "true"
