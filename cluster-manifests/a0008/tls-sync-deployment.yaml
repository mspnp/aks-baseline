# This Deployment keeps the CSI volume mounted so that the Secrets Store
# Driver continuously syncs the TLS certificate from Azure Key Vault into
# the bu0001a0008-ingress-tls Kubernetes Secret.  The Secret is referenced
# by the Gateway resource for HTTPS termination.
#
# If all pods that mount the SecretProviderClass are deleted, the CSI
# driver garbage-collects the synced Secret.  This always-running pod
# prevents that from happening.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-sync
  namespace: a0008
  labels:
    app.kubernetes.io/name: tls-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tls-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tls-sync
    spec:
      automountServiceAccountToken: false
      containers:
      - name: tls-sync
        image: ${CONTAINER_REGISTRY_URL}/azurelinux/busybox:1.36
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tls-csi
          mountPath: /mnt/tls
          readOnly: true
      volumes:
      - name: tls-csi
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: bu0001a0008-ingress-tls
      nodeSelector:
        agentpool: npuser01
      securityContext:
        seccompProfile:
          type: RuntimeDefault
