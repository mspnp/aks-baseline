# SecretProviderClass syncs the AKS ingress TLS certificate from Azure Key Vault
# into a Kubernetes Secret that the Gateway resource references via certificateRefs.
# The CSI Secrets Store Driver creates and maintains this Secret as long as at least
# one pod mounts the corresponding CSI volume (see tls-sync-deployment.yaml).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bu0001a0008-ingress-tls
  namespace: a0008
  labels:
    app.kubernetes.io/name: bu0001a0008-ingress-tls
spec:
  provider: azure
  secretObjects:
  - secretName: bu0001a0008-ingress-tls
    type: kubernetes.io/tls
    data:
    - objectName: tls-crt
      key: tls.crt
    - objectName: tls-key
      key: tls.key
  parameters:
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${CSI_IDENTITY_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    objects: |
      array:
        - |
          objectName: aks-ingress-tls
          objectAlias: tls-crt
          objectType: cert
        - |
          objectName: aks-ingress-tls
          objectAlias: tls-key
          objectType: secret
    tenantID: "${TENANT_ID}"
