# Namespace-scoped RBAC for ama-metrics service account in a0008 namespace.
# Pre-provisioned to survive K8s 1.37+ which removes cluster-wide Secret read access.
# Grants get/list on Secrets so ama-metrics can scrape targets referencing K8s Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ama-metrics-secret-reader
  namespace: a0008
rules:
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ama-metrics-secret-reader-binding
  namespace: a0008
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ama-metrics-secret-reader
subjects:
  - kind: ServiceAccount
    name: ama-metrics
    namespace: kube-system
